name: Tunnel core

# Builds libv2ray.aar — the Xray engine wrapped by gomobile — on GitHub's runners rather than
# on a developer machine. The toolchain is a Go SDK plus the Android NDK, which is exactly the
# kind of large download this project moved to Actions to avoid.
#
# Manual trigger only: the output changes when upstream changes, not when this app does, so
# there is no reason to rebuild it on every push. Download the artifact, drop the .aar into
# app/libs/, and the app switches from MissingTunnelCore to the real engine on its next build.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Tag, branch or commit of 2dust/AndroidLibXrayLite (blank = default branch)"
        required: false
        default: ""
      android_api:
        description: "Minimum Android API for the native code — must not exceed the app's minSdk of 24"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AndroidLibXrayLite
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: ${{ inputs.upstream_ref }}
          path: core
          fetch-depth: 0

      # A binary with no record of where it came from is not something to ship. This is the
      # provenance that app/libs/README.md asks for.
      - name: Record what is being built
        working-directory: core
        run: |
          {
            echo "repository: 2dust/AndroidLibXrayLite"
            echo "commit:     $(git rev-parse HEAD)"
            echo "describes:  $(git describe --tags --always 2>/dev/null || echo n/a)"
            echo "committed:  $(git log -1 --format=%cI)"
          } | tee "$GITHUB_WORKSPACE/provenance.txt"

      # Upstream's layout is not verified in this repo, so it is reported instead of assumed.
      # When a later step guesses wrong, this output is what corrects it.
      - name: Inspect upstream layout
        working-directory: core
        run: |
          {
            echo '### Root entries'; ls -A
            echo; echo '### go.mod'; cat go.mod 2>/dev/null || echo '(none)'
            echo; echo '### Build scripts and workflows'
            find . -maxdepth 3 \
              \( -name Makefile -o -name '*.sh' -o -path './.github/workflows/*' \) \
              -not -path './.git/*' -print
            echo; echo '### Exported Go symbols at the module root'
            grep -hoE '^func [A-Z][A-Za-z0-9_]*|^type [A-Z][A-Za-z0-9_]*' ./*.go | sort -u
            echo; echo '### Exported Go declarations in full, with their doc comments'
            # javap gives types but not parameter names, so `startLoop(String, int)` does not
            # say what the int is. The Go source does, and getting it wrong is a bug that
            # compiles — hence printing the declarations rather than inferring them.
            awk '
              /^\/\// { doc = doc $0 "\n"; next }
              /^func [A-Z]/ || /^func \([^)]*\) [A-Z]/ || /^type [A-Z]/ {
                printf "%s%s\n\n", doc, $0; doc = ""; next
              }
              { doc = "" }
            ' ./*.go
          } | tee "$GITHUB_WORKSPACE/layout.txt"

      # Upstream's go.mod picks the Go version — this repo has no business overriding it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the NDK the runner already ships rather than naming a version that may not exist.
      - name: Locate the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          test -d "$NDK" || { echo "::error::no NDK found on this runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"
          grep Pkg.Revision "$NDK/source.properties" || true

      - name: Install gomobile
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          gomobile version

          # `gomobile bind` compiles golang.org/x/mobile/bind into the module being bound, so
          # that package has to be resolvable from this module. It usually already is; adding
          # it when it is not turns a hard failure into a working build.
          if ! grep -q 'golang.org/x/mobile' go.mod; then
            echo "x/mobile absent from go.mod — adding it"
            go get golang.org/x/mobile/bind
          fi

      - name: Build libv2ray.aar
        working-directory: core
        run: |
          go mod download
          MODULE="$(go list -m)"
          echo "Binding module: $MODULE"

          # -checklinkname=0 is required, not cosmetic. Xray pulls in github.com/wlynxg/anet,
          # which reaches net.zoneCache through //go:linkname. Go 1.23 made the linker reject
          # linkname references to symbols that have not opted in, so without this the link
          # fails with "invalid reference to net.zoneCache". The flag restores the pre-1.23
          # behaviour for the whole link.
          LDFLAGS='-s -w -checklinkname=0'

          # Printed on its own line so a stale workflow is obvious at a glance: if this line
          # is missing from the log, the run is executing an older commit of this file.
          echo "::notice::linking with -ldflags '$LDFLAGS'"

          gomobile bind -v \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi "${{ inputs.android_api }}" \
            -ldflags="$LDFLAGS" \
            -o "$GITHUB_WORKSPACE/libv2ray.aar" \
            "$MODULE"
          ls -l "$GITHUB_WORKSPACE/libv2ray.aar"

      # The reason this job matters on its first run: the app's TunnelCore binding has to be
      # written against the engine's real signatures. Guessing them from memory produces code
      # that does not compile, so the API is printed here and read before anything is bound.
      - name: Report the .aar API surface
        continue-on-error: true
        run: |
          mkdir -p unpacked && cd unpacked
          unzip -oq "$GITHUB_WORKSPACE/libv2ray.aar"
          # gomobile emits a large generated surface. The interesting types are the wrapper's
          # own; the go.* runtime support classes are noise, so they are listed but not dumped.
          ALL="$(unzip -Z1 classes.jar | sed -n 's#\.class$##p' | tr '/' '.')"
          OWN="$(printf '%s\n' "$ALL" | grep -v '^go\.' || true)"
          {
            echo '### Archive contents'
            unzip -Z1 "$GITHUB_WORKSPACE/libv2ray.aar"
            echo; echo '### All classes'
            printf '%s\n' "$ALL"
            echo; echo '### Public and protected API (excluding the go.* runtime)'
            javap -protected -classpath classes.jar $OWN
          } | tee "$GITHUB_WORKSPACE/api.txt"

          # The full dump runs to thousands of lines. Writing the binding needs a much smaller
          # subset — the entry-point type, the callback interface, and the handful of methods
          # that start, stop and report on a tunnel — so it is distilled into its own short
          # file that is cheap to read or paste back.
          {
            echo '### Declared types'
            javap -protected -classpath classes.jar $OWN \
              | grep -E '^(public|abstract|final)?\s*(class|interface)' || true
            echo; echo '### Members that look load-bearing for a tunnel binding'
            javap -protected -classpath classes.jar $OWN \
              | grep -iE '(class|interface) |run|start|stop|loop|config|protect|setup|shut|stat|quer|delay|tun|fd|point|controller|callback|version' \
              || true
          } | tee "$GITHUB_WORKSPACE/cheatsheet.txt"

      # Rendered on the run's summary page so the report can be read in a browser instead of
      # downloaded — this project is built in CI precisely because the local pipe is slow.
      # Cheat sheet first: it is the short one, and it is what the binding is written from.
      - name: Publish the reports to the run summary
        if: always()
        run: |
          for f in cheatsheet.txt provenance.txt layout.txt api.txt; do
            [ -f "$f" ] || continue
            printf '## %s\n```text\n' "$f" >> "$GITHUB_STEP_SUMMARY"
            head -c 120000 "$f" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload libv2ray.aar
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: libv2ray.aar
          if-no-files-found: error

      # always(): a failed build is when the layout report is most useful.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-report
          path: |
            cheatsheet.txt
            provenance.txt
            layout.txt
            api.txt
          if-no-files-found: warn

  # Proves the app actually compiles against the core that was just built. Without this the
  # first person to find out that the binding does not match the .aar is whoever downloads it,
  # on a slow connection, by hand — which is the situation this whole CI setup exists to avoid.
  verify-app:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out this app
        uses: actions/checkout@v4

      - name: Fetch the core that was just built
        uses: actions/download-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Install Gradle 8.10
        run: |
          curl -sSfLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q -d "$HOME/gradle-dist" /tmp/gradle.zip
          echo "$HOME/gradle-dist/gradle-8.10/bin" >> "$GITHUB_PATH"

      # Guards against a silent pass: if the .aar or the binding dir were missing, the build
      # would fall back to the coreless path and go green without compiling the binding at all.
      - name: Confirm both halves of the core are present
        id: halves
        run: |
          test -f app/libs/libv2ray.aar || { echo "::error::libv2ray.aar missing"; exit 1; }
          if [ -d app/src/withCore/java ]; then
            echo "binding=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no binding in src/withCore/java yet — nothing to verify"
            echo "binding=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app against the core
        if: steps.halves.outputs.binding == 'yes'
        run: gradle --no-daemon assembleDebug

      - name: Upload the core-enabled APK
        if: steps.halves.outputs.binding == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: v2raytunkmz-debug-apk-with-core
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

