name: Android CI

# Builds the debug APK in the cloud on every push, so you don't have to build locally.
# Download the finished APK from the run's "Artifacts" section (v2raytunkmz-debug-apk).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides Gradle 8.10 on PATH (AGP 8.7.3 needs Gradle 8.9+). This means we can call
      # `gradle` directly and do not need a committed gradle-wrapper.jar.
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Unit tests (parsers)
        run: gradle :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v2raytunkmz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
