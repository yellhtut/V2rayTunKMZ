name: Android CI

# Builds the debug APK in the cloud on every push, so you don't have to build locally.
# Download the finished APK from the run's "Artifacts" section (v2raytunkmz-debug-apk).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      # Installed by hand rather than via setup-gradle: AGP 8.7.3 needs Gradle 8.9+, and the
      # runner's own /usr/bin/gradle may be a different major version. Downloading the exact
      # distribution keeps the build reproducible and needs no committed gradle-wrapper.jar.
      - name: Install Gradle 8.10
        run: |
          curl -sSfLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q -d "$HOME/gradle-dist" /tmp/gradle.zip
          echo "$HOME/gradle-dist/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle and JDK
        run: gradle --version

      - name: Unit tests (parsers)
        run: gradle :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v2raytunkmz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
