org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Note: do NOT set org.gradle.java.home here. It is machine-specific and breaks CI
# (a Windows path is invalid on the Linux runners). Put it in your user-level
# ~/.gradle/gradle.properties instead — that file is per-machine and never committed.
